name: Validate shared components
on:
  pull_request:
    paths:
      - 'src/re8ch-*'
      - 'dist/**'
      - 'company/**'
      - 'scripts/build-public-records.py'
      - 'tests/shared-components.test.mjs'
      - '.github/workflows/validate-shared-components.yml'
  push:
    branches: [main]
    paths:
      - 'src/re8ch-*'
      - 'dist/**'
      - 'company/**'
      - 'scripts/build-public-records.py'
      - 'tests/shared-components.test.mjs'
      - '.github/workflows/validate-shared-components.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check src/re8ch-navigator.js
      - run: node --check src/re8ch-footer.js
      - run: node --test tests/shared-components.test.mjs
      - name: Validate public company record manifest
        run: |
          node -e "const r=require('./company/records.json'); if(r.schemaVersion!==1||r.entities.length!==2) process.exit(1)"
          test -f company/documents/reachieve-llc-certificate-of-existence-public.pdf
          test -f company/documents/reach-software-studio-business-license-public.webp
